name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E and coverage gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check assets/clipboard2markdown.js && node --check assets/to-markdown.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with coverage gate
        run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: node e2e/support/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
